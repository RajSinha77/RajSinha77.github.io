<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="Raj Sinha's Blog">
  <meta name="author" content="Raj Sinha">

  <title data-i18n="pageTitle">Blog - RAJ SINHA</title>
  <link rel="icon" href="icon.png" type="image/gif" sizes="20x20">

  <!-- Bootstrap core CSS -->
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Saira+Extra+Condensed:500,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Muli:400,400i,800,800i&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet">

  <!-- Custom styles for portfolio -->
  <link href="css/resume.min.css" rel="stylesheet">
  
  <!-- Your custom styles for the dynamic blog cards -->
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: Muli, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
      padding-top: 54px;
      color: #3b4044;
    }
    @media (min-width: 992px) {
      body { padding-top: 0; padding-left: 17rem; }
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Saira Extra Condensed', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      color: #343a40;
    }
  </style>
</head>

<body id="page-top">
  <!-- Language Switcher -->
  <div style="position: fixed; top: 10px; right: 10px; z-index: 9999;">
    <select id="languageSelect">
      <option value="en">EN</option>
      <option value="de">DE</option>
    </select>
  </div>

  <!-- Sidebar Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top" id="sideNav">
    <a class="navbar-brand js-scroll-trigger" href="index.html">
      <span class="d-block d-lg-none" data-i18n="shortName">RAJ SINHA</span>
      <span class="d-none d-lg-block">
        <img class="img-fluid img-profile rounded-circle mx-auto mb-2" src="profile.jpg" alt="Profile picture">
      </span>
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="index.html#about" data-i18n="navAbout">About</a></li>
        <li class="nav-item"><a class="nav-link" href="experience.html" data-i18n="navExperience">Experience</a></li>
        <li class="nav-item"><a class="nav-link" href="education.html" data-i18n="navEducation">Education</a></li>
        <li class="nav-item"><a class="nav-link" href="projects.html" data-i18n="navProject">Projects</a></li>
        <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#page-top" data-i18n="navBlog" style="color: #fff;">Blog</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container-fluid p-0">
    <section class="resume-section p-3 p-lg-5 d-flex flex-column" id="blog">
      <div class="my-auto">
        <h2 class="mb-4" data-i18n="blogHeader">Blog</h2>
        <p class="lead mb-5" data-i18n="latestPosts">Page under construction</p>
        
        <!-- YOUR DYNAMIC BLOG GRID -->
        <section class="blog-grid">
          <!-- Blog cards will be dynamically inserted here by script.js -->
        </section>

      </div>
    </section>
  </div>

  <!-- Footer -->
  <footer class="page-footer font-small myfooter text-center mt-5">
    <p data-i18n="footer">Made with 💙 by Raj Sinha</p>
  </footer>

  <!-- Core Scripts -->
  <script src="vendor/jquery/jquery.min.js"></script>
  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="vendor/jquery-easing/jquery.easing.min.js"></script>
  <script src="js/resume.min.js"></script>
  
  <!-- YOUR SCRIPT TO LOAD THE BLOG CARDS -->
  <script src="script.js"></script>

  <!-- Translation Script -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const translations = {
        en: {
          pageTitle: "Blog - RAJ SINHA",
          navAbout: "About",
          navExperience: "Experience",
          navEducation: "Education",
          navProject: "Projects",
          navBlog: "Blog",
          shortName: "RAJ SINHA",
          footer: "Made with 💙 by Raj Sinha",
          blogHeader: "Blog",
          latestPosts: "Page under construction"
        },
        de: {
          pageTitle: "Blog - RAJ SINHA",
          navAbout: "Über",
          navExperience: "Erfahrung",
          navEducation: "Ausbildung",
          navProject: "Projekte",
          navBlog: "Blog",
          shortName: "RAJ SINHA",
          footer: "Mit 💙 gemacht von Raj Sinha",
          blogHeader: "Blog",
          latestPosts: "Seite im Aufbau"
        }
      };

      const languageSelect = document.getElementById('languageSelect');

      function updateLanguage(lang) {
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (translations[lang] && translations[lang][key]) {
            el.innerHTML = translations[lang][key];
          }
        });
        document.title = translations[lang].pageTitle || "RAJ SINHA";
        document.documentElement.lang = lang;
        localStorage.setItem('preferredLang', lang);
      }

      // Initialize language from localStorage
      const savedLang = localStorage.getItem('preferredLang') || 'en';
      languageSelect.value = savedLang;
      updateLanguage(savedLang);

      languageSelect.addEventListener('change', (e) => {
        updateLanguage(e.target.value);
      });
    });
  </script>
</body>
</html>
