<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title">Raj's Blog</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Muli:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="#" class="logo" data-i18n="logo">Raj's Blog</a>
      <div class="nav-links" id="navLinks">
        <a href="index.html" data-i18n="home">Home</a>
        <a href="blog.html" data-i18n="blog">Blog</a>
        <a href="about.html" data-i18n="about">About</a>
      </div>
      <button class="menu-toggle" id="mobileMenuToggle" aria-label="Toggle navigation">☰</button>
    </div>
  </nav>

  <!-- Language Switcher -->
  <div class="language-switcher">
    <select id="languageSelect">
      <option value="en">EN</option>
      <option value="de">DE</option>
    </select>
  </div>

  <!-- Blog Content -->
  <main class="blog-content">
    <section class="blog-header">
      <h1 data-i18n="latestPosts">page under construction</h1>
    </section>

    <section class="blog-grid">
      <!-- Blog cards will be dynamically inserted here -->
    </section>
  </main>

  <!-- Footer -->
  <footer class="page-footer">
    <p data-i18n="footer">Made with 💙 by Raj Sinha</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
