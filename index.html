  <!-- Translation Script -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const translations = {
        en: {
          pageTitle: "RAJ SINHA",
          navAbout: "About",
          navEducation: "Education",
          navProject: "Projects",
          navBlog: "Blog",
          firstName: "RAJ",

"Hi, I’m Raj Sinha — a Data Scientist with 4+ years of experience in Machine Learning, Time Series Forecasting, and Data Engineering.",
  "Currently working on forecasting and automation at Siemens AG, I enjoy solving real-world problems through advanced ML and GenAI solutions.",
  "Let’s connect and create something meaningful together!"
        ],
          downloadCV: "Download CV",
          emailMe: "Email me",
          footer: "Made with 💙 by Raj Sinha",
          phoneNumber: "+49 176 2915 1976"
        },
        de: {
          pageTitle: "RAJ SINHA",
          navAbout: "Über",
          navEducation: "Ausbildung",
          navProject: "Projekt",
          navBlog: "Blog",
          firstName: "RAJ",
          lastName: "SINHA",
          position: "Data Scientist | Data Analyst | Machine Learning Engineer",
          description: [
    "Hallo, ich bin Raj Sinha — ein Data Scientist mit über 4 Jahren Erfahrung in Machine Learning, Zeitreihenanalyse und Data Engineering.",
  "Derzeit arbeite ich bei Siemens AG an Prognosen und Automatisierungslösungen, um reale Probleme mit moderner ML- und GenAI-Technologie zu lösen.",
  "Lass uns vernetzen und gemeinsam etwas Bedeutungsvolles schaffen!"
    ],
    

          downloadCV: "Lebenslauf herunterladen",
          emailMe: "E-Mail senden",
          footer: "Mit 💙 gemacht von Raj Sinha",
          phoneNumber: "+49 176 2915 1976"
        }
      };

      const languageSelect = document.getElementById('languageSelect');

      function updateLanguage(lang) {
        // Update all translatable elements
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (translations[lang] && translations[lang][key]) {
            el.innerHTML = translations[lang][key];
          }
        });

        // Update page title and HTML lang attribute
        document.title = translations[lang].pageTitle;
        document.documentElement.lang = lang;
        localStorage.setItem('preferredLang', lang);
      }

      // Initialize language
      const savedLang = localStorage.getItem('preferredLang') || 'en';
      languageSelect.value = savedLang;
      updateLanguage(savedLang);

      languageSelect.addEventListener('change', (e) => {
        updateLanguage(e.target.value);
      });
    });
  </script>
