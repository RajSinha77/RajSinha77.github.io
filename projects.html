<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Same head section as index.html -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="Raj Sinha's Blog">
  <meta name="author" content="Raj Sinha">
  <meta name="keywords" content="Data Science, Machine Learning, Blog">

  <title data-i18n="blogPageTitle">Raj's Blog</title>
  <link rel="icon" href="icon.png" type="image/gif" sizes="20x20">

  <!-- Same CSS links as index.html -->
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Saira+Extra+Condensed:500,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Muli:400,400i,800,800i&display=swap" rel="stylesheet">
  <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
  <link href="css/resume.min.css" rel="stylesheet">

  <style>
    /* Add blog-specific styles */
    .blog-card {
      transition: transform 0.3s ease;
      border: none;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 2rem;
    }

    .blog-card:hover {
      transform: translateY(-5px);
    }

    .card-img-top {
      height: 200px;
      object-fit: cover;
    }

    .card-date {
      color: #6c757d;
      font-size: 0.9rem;
    }

    .read-more-btn {
      background-color: #00549c;
      color: white !important;
      border-radius: 0;
      padding: 8px 20px;
    }

    .blog-header {
      margin-bottom: 3rem;
      padding-top: 2rem;
    }
  </style>
</head>

<body id="page-top">
  <!-- Language Selector -->
  <div style="position: fixed; top: 10px; right: 10px; z-index: 9999;">
    <select id="languageSelect">
      <option value="en">EN</option>
      <option value="de">DE</option>
    </select>
  </div>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top" id="sideNav">
    <!-- Same navigation as index.html -->
    <a class="navbar-brand js-scroll-trigger" href="index.html">
      <span class="d-block d-lg-none" data-i18n="shortName">RAJ SINHA</span>
      <span class="d-none d-lg-block">
        <img class="img-fluid img-profile rounded-circle mx-auto mb-2" src="profile.jpg" alt="Profile picture">
      </span>
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="index.html" data-i18n="navAbout">About</a></li>
        <li class="nav-item"><a class="nav-link" href="index.html#more" data-i18n="navEducation">Education</a></li>
        <li class="nav-item"><a class="nav-link" href="index.html#interests" data-i18n="navInterests">Interests</a></li>
        <li class="nav-item"><a class="nav-link active" href="blog.html" data-i18n="navBlog">Blog</a></li>
      </ul>
    </div>
  </nav>

  <div class="container-fluid p-0">
    <!-- Blog Header -->
    <section class="resume-section p-3 p-lg-5 d-flex flex-column blog-header">
      
      <h2 class="mb-5" data-i18n="blogTitle">Latest Posts</h2>
    </section>
    

    <!-- Blog Posts Grid -->
    <section class="resume-section p-3 p-lg-5 d-flex flex-column">
      <div class="row" id="blogPosts">
        <!-- Posts will be inserted here via JS -->
      </div>
    </section>
  </div>

  <footer class="page-footer font-small myfooter text-center">
    <p data-i18n="footer">Made with 💙 by Raj Sinha</p>
  </footer>

  <!-- Same scripts as index.html -->
  <script src="vendor/jquery/jquery.min.js"></script>
  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="vendor/jquery-easing/jquery.easing.min.js"></script>

  <!-- Translation Script with Blog Additions -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const translations = {
        en: {
          // Existing translations...
          blogPageTitle: "Raj's Blog | Data Science Insights",
          blogTitle: "Latest Posts",
          readMore: "Read More",
          posts: {
            post1: {
              title: "Optimizing Hyperparameters in Production ML Systems",
              date: "March 15, 2023",
              excerpt: "Best practices for hyperparameter tuning in enterprise machine learning pipelines..."
            },
            post2: {
              title: "Time Series Forecasting with Transformers",
              date: "February 28, 2023",
              excerpt: "Implementing transformer architectures for multivariate time series prediction..."
            }
          }
        },
        de: {
          // Existing translations...
          blogPageTitle: "Rajs Blog | Data Science Einblicke",
          blogTitle: "Aktuelle Beiträge",
          readMore: "Weiterlesen",
          posts: {
            post1: {
              title: "Optimierung von Hyperparametern in Produktions-ML-Systemen",
              date: "15. März 2023",
              excerpt: "Best Practices für die Hyperparameter-Optimierung in Unternehmens-ML-Pipelines..."
            },
            post2: {
              title: "Zeitreihenvorhersage mit Transformern",
              date: "28. Februar 2023",
              excerpt: "Implementierung von Transformer-Architekturen für multivariate Zeitreihenvorhersagen..."
            }
          }
        }
      };

      // Blog post data
      const posts = [
        {
          id: 'post1',
          img: 'blog1.jpg',
          tags: ['Machine Learning', 'Best Practices']
        },
        {
          id: 'post2',
          img: 'blog2.jpg',
          tags: ['Deep Learning', 'Time Series']
        }
      ];

      // Language management functions
      const languageSelect = document.getElementById('languageSelect');
      
      function updateLanguage(lang) {
        // Update translations
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (translations[lang] && translations[lang][key]) {
            el.innerHTML = translations[lang][key];
          }
        });

        // Update blog posts
        const blogPosts = document.getElementById('blogPosts');
        blogPosts.innerHTML = posts.map(post => `
          <div class="col-lg-4 col-md-6 mb-4">
            <div class="card blog-card">
              <img src="${post.img}" class="card-img-top" alt="${translations[lang].posts[post.id].title}">
              <div class="card-body">
                <div class="card-date">${translations[lang].posts[post.id].date}</div>
                <h5 class="card-title">${translations[lang].posts[post.id].title}</h5>
                <p class="card-text">${translations[lang].posts[post.id].excerpt}</p>
                <a href="#" class="btn read-more-btn" data-i18n="readMore">${translations[lang].readMore}</a>
              </div>
            </div>
          </div>
        `).join('');
        
        document.title = translations[lang].blogPageTitle;
        document.documentElement.lang = lang;
        localStorage.setItem('preferredLang', lang);
      }

      // Initialize
      const savedLang = localStorage.getItem('preferredLang') || 'en';
      languageSelect.value = savedLang;
      updateLanguage(savedLang);

      languageSelect.addEventListener('change', (e) => {
        updateLanguage(e.target.value);
      });
    });
  </script>
</body>
</html>
